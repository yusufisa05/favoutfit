<h1>{{ product.title }}</h1>
<p>Kategori: {{ product.category }}</p>
<p>Fiyat: {{ product.price }} TL</p>
<p>Açıklama: {{ product.description }}</p>
<p>Eklenme: {{ product.created_at }}</p>

<a href="{% url 'add_to_cart' product.id %}">Sepete Ekle</a>

{% if product.image %}
    <img src="{{ product.image.url }}" width="300">
{% endif %}
